          EXPO_PUBLIC_GROQ_API_KEY_4=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
          EXPO_PUBLIC_GROQ_API_KEY_5=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
          EXPO_PUBLIC_GROQ_API_KEY_6=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
