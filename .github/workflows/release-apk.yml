name: Release Production Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'plugins/**'
      - 'assets/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'New Version (leave blank to auto-bump patch version)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes summary'
        required: false
        default: 'Production standalone Android APK release with performance and security optimizations.'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Verify & Publish Production APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 5. Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 6. Automated Quality Gate - TypeScript Verification
        run: |
          echo "Running strict TypeScript compiler validation..."
          npx tsc --noEmit

      - name: 7. Synchronize Version & Increment VersionCode
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            node scripts/bump-version.js "${{ github.event.inputs.release_version }}"
          else
            node scripts/bump-version.js
          fi
          
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "NEW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Prepared release v$VERSION (code: $VERSION_CODE)"

      - name: 7b. Inject Production Environment Variables for Bundler
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_MOBILE_API_URL=https://api-mobile.chatboxai.co.in
          EXPO_PUBLIC_WEB_API_URL=https://chatboxai.co.in
          EXPO_PUBLIC_APPWRITE_ENDPOINT=https://nyc.cloud.appwrite.io/v1
